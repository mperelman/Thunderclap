        function extractSuggestedQuestions(text) {
            // Extract suggested questions section - match all common variations
            const patterns = [
                /Related Questions:\s*([\s\S]*?)$/i,  // Check this first - most common format
                /\*\*Related Questions:\*\*\s*([\s\S]*?)$/i,
                /Here are some potential follow-up questions.*?:\s*([\s\S]*?)$/i,
                /Potential follow-up questions.*?:\s*([\s\S]*?)$/i,
                /Follow-up questions.*?:\s*([\s\S]*?)$/i,
                /\*\*Suggested Questions:\*\*\s*([\s\S]*?)$/i,
                /Suggested Questions:\s*([\s\S]*?)$/i,
                /\*\*Questions for further exploration:\*\*\s*([\s\S]*?)$/i
            ];
            
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match) {
                    const questionsSection = match[1];
                    const questions = [];
                    
                    // PRIORITY 1: Handle questions on same line separated by "?*" pattern: "Question?* Question?* Question?"
                    // CRITICAL: Split on "?*" not just "*" because questions contain asterisks for italics (e.g., *Bank of Montreal*)
                    // This must come FIRST because it's the most common format from the LLM
                    if (questionsSection.includes('?*')) {
                        // Remove any leading/trailing whitespace and normalize
                        const normalized = questionsSection.trim();
                        // Split on "?*" or "? *" (question mark followed by asterisk, with optional space)
                        const questionSplit = normalized.split(/\?\s*\*\s*/);
                        const questionMatches = [];
                        for (let i = 0; i < questionSplit.length; i++) {
                            let q = questionSplit[i].trim();
                            // Add back the ? that was removed by split (except for last one if it already has ?)
                            if (i < questionSplit.length - 1 || !q.endsWith('?')) {
                                q = q + '?';
                            }
                            // Skip empty or very short questions
                            if (q.length > 10) {
                                questionMatches.push(q);
                            }
                        }
                        if (questionMatches.length > 0) {
                            const cleanText = text.substring(0, match.index).trim();
                            console.log('[EXTRACT] Found', questionMatches.length, 'questions from ?* split:', questionMatches);
                            return { text: cleanText, questions: questionMatches };
                        }
                    }
                    
                    // PRIORITY 2: Parse line by line - this handles bullet format correctly
                    // Format: "* Question 1?\n* Question 2?\n* Question 3?"
                    const lines = questionsSection.split('\n');
                    const lineMatches = [];
                    for (const line of lines) {
                        const trimmed = line.trim();
                        // Skip empty lines
                        if (!trimmed) continue;
                        // Match bullet format: "* Question?" or "- Question?" or "• Question?"
                        const bulletMatch = trimmed.match(/^[-•→*]\s*(.+)$/);
                        if (bulletMatch) {
                            const q = bulletMatch[1].trim();
                            if (q.length > 10 && q.endsWith('?')) {
                                lineMatches.push(q);
                            }
                        } else if (trimmed.length > 10 && trimmed.endsWith('?') && !trimmed.match(/^\d+\./)) {
                            // Standalone question without bullet (but check it doesn't contain ?* which means it's multiple questions)
                            if (!trimmed.includes('?*')) {
                                lineMatches.push(trimmed);
                            }
                        }
                    }
                    if (lineMatches.length > 0) {
                        const cleanText = text.substring(0, match.index).trim();
                        console.log('[EXTRACT] Found', lineMatches.length, 'questions from line-by-line parsing:', lineMatches);
                        return { text: cleanText, questions: lineMatches };
                    }
                    
                    // PRIORITY 3: Fallback: Handle questions separated by just "*" (less common, but handle it)
                    // Only if we didn't find "?*" pattern
                    if (questionsSection.includes('*')) {
                        // Remove any leading/trailing whitespace and normalize
                        const normalized = questionsSection.trim();
                        // Try splitting on "* " (asterisk followed by space and capital letter/question word)
                        // This handles "* Question?* Question?" format
                        const asteriskSplit = normalized.split(/\s*\*\s+(?=[A-Z])/);
                        const asteriskMatches = [];
                        for (const part of asteriskSplit) {
                            const q = part.trim();
                            // Skip empty parts
                            if (!q) continue;
                            // Must be a complete question (ends with ? and has content)
                            if (q.length > 10 && q.endsWith('?')) {
                                asteriskMatches.push(q);
                            } else if (q.length > 10 && !q.endsWith('?') && q.match(/^(What|Who|How|When|Where|Why|Tell me)/i)) {
                                // Question word but missing ? - add it
                                asteriskMatches.push(q + '?');
                            }
                        }
                        if (asteriskMatches.length > 0) {
                            const cleanText = text.substring(0, match.index).trim();
                            console.log('[EXTRACT] Found', asteriskMatches.length, 'questions from asterisk-split fallback:', asteriskMatches);
                            return { text: cleanText, questions: asteriskMatches };
                        }
                    }
                    
                    // Fallback: Also try: Questions on same line separated by multiple spaces and asterisks
                    // Pattern: "Question1*   Question2*   Question3?"
                    const inlineAsteriskPattern = /([^*?]+(?:[?]|Tell me|What|Who|How|When|Where|Why)[^*]*)/gi;
                    const inlineMatches = [];
                    let inlineMatch;
                    while ((inlineMatch = inlineAsteriskPattern.exec(questionsSection)) !== null) {
                        const q = inlineMatch[1].trim();
                        if (q.length > 10) {
                            inlineMatches.push(q);
                        }
                    }
                    if (inlineMatches.length > 1) {
                        const cleanText = text.substring(0, match.index).trim();
                        console.log('[EXTRACT] Found', inlineMatches.length, 'questions from inline pattern:', inlineMatches);
                        return { text: cleanText, questions: inlineMatches };
                    }
                    
                    // Second try: Extract questions from lines (numbers or bullets)
                    // First, normalize the text - handle cases where questions are split incorrectly
                    // CRITICAL: Handle questions concatenated on one line: "Boston?2. How did..." -> "Boston?\n2. How did..."
                    // Split BEFORE the number pattern, not after the question mark
                    let normalizedSection = questionsSection;
                    // Pattern: question mark followed immediately by number: "?2." -> "?\n2."
                    normalizedSection = normalizedSection.replace(/([?])(\d+)\./g, '$1\n$2.');
                    // Pattern: question mark, space(s), then number: "? 2." -> "?\n2."
                    normalizedSection = normalizedSection.replace(/([?])\s+(\d+)\./g, '$1\n$2.');
                    // Pattern: Handle concatenated questions like "RR contribute to the Panic of 1901?3. What actions did"
                    // Split on number pattern even if it comes after a question mark on same line
                    normalizedSection = normalizedSection.replace(/([?])(\d+)\./g, '$1\n$2.');
                    // Also handle if questions are on same line without question marks: "Boston.2. How..." -> "Boston.\n2. How..."
                    // But only if preceded by a word (not already a number)
                    normalizedSection = normalizedSection.replace(/([a-zA-Z])(\d+)\./g, '$1\n$2.');
                    // CRITICAL: Also handle bullets that might be concatenated: "* Question 1?* Question 2?" -> "* Question 1?\n* Question 2?"
                    normalizedSection = normalizedSection.replace(/([?])\s*(\*)/g, '$1\n$2');
                    // Handle bullets without question marks: "Question 1* Question 2" -> "Question 1\n* Question 2"
                    normalizedSection = normalizedSection.replace(/([a-zA-Z])\s*(\*)/g, '$1\n$2');
                    
                    // CRITICAL: Handle incomplete questions that start mid-sentence
                    // If a line doesn't start with a number, bullet, or question word, it's likely a continuation or incomplete
                    // Check if first "question" starts mid-sentence and remove it
                    const firstLine = normalizedSection.split('\n')[0]?.trim() || '';
                    const questionStartPattern = /^(What|Who|How|When|Where|Why|Tell me|Describe|Explain|\d+\.|[-•→*])/i;
                    if (firstLine && !questionStartPattern.test(firstLine) && firstLine.length > 0) {
                        // First line is incomplete - remove it and everything before the first numbered/bulleted question
                        const firstNumberMatch = normalizedSection.match(/(\d+\.)/);
                        const firstBulletMatch = normalizedSection.match(/^[-•→*]/m);
                        if (firstNumberMatch && firstBulletMatch) {
                            // Use whichever comes first
                            const numberIndex = normalizedSection.indexOf(firstNumberMatch[0]);
                            const bulletIndex = normalizedSection.indexOf(firstBulletMatch[0]);
                            const firstIndex = Math.min(numberIndex, bulletIndex);
                            normalizedSection = normalizedSection.substring(firstIndex);
                        } else if (firstNumberMatch) {
                            const firstNumberIndex = normalizedSection.indexOf(firstNumberMatch[0]);
                            normalizedSection = normalizedSection.substring(firstNumberIndex);
                        } else if (firstBulletMatch) {
                            const firstBulletIndex = normalizedSection.indexOf(firstBulletMatch[0]);
                            normalizedSection = normalizedSection.substring(firstBulletIndex);
                        }
                    }
                    
                    // Fallback: If still all on one line, try splitting by number pattern directly
                    // This handles cases like "1. Question?2. Question?3. Question?"
                    if (!normalizedSection.includes('\n') && normalizedSection.match(/\d+\./)) {
                        // Split on number pattern but keep the number with the question
                        normalizedSection = normalizedSection.replace(/(\d+)\./g, '\n$1.');
                        // Remove leading newline
                        normalizedSection = normalizedSection.replace(/^\n+/, '');
                    }
                    
                    const normalizedLines = normalizedSection.split('\n');
                    let currentQuestion = '';
                    
                    for (let i = 0; i < normalizedLines.length; i++) {
                        const line = normalizedLines[i].trim();
                        if (!line) {
                            // Empty line - if we have a current question, save it
                            if (currentQuestion && currentQuestion.length > 10) {
                                questions.push(currentQuestion.trim());
                                currentQuestion = '';
                            }
                            continue;
                        }
                        
                        // Check if this line starts a new numbered question (e.g., "2. How did...")
                        const numberMatch = line.match(/^(\d+)\.\s*(.+)$/);
                        if (numberMatch) {
                            // Save previous question if we have one
                            if (currentQuestion && currentQuestion.length > 10) {
                                questions.push(currentQuestion.trim());
                            }
                            // Start new question
                            currentQuestion = numberMatch[2];
                        }
                        // Check if this line starts a bullet question (e.g., "* Question?" or "- Question?")
                        else if (line.match(/^[-•→*]\s*(.+)$/)) {
                            const bulletMatch = line.match(/^[-•→*]\s*(.+)$/);
                            if (bulletMatch) {
                                // Save previous question if we have one
                                if (currentQuestion && currentQuestion.length > 10) {
                                    questions.push(currentQuestion.trim());
                                }
                                // Start new question
                                currentQuestion = bulletMatch[1];
                            }
                        }
                        // If we're building a question, continue appending to it
                        else if (currentQuestion) {
                            // Append to current question (handles multi-line questions)
                            // But stop if we hit a new question marker
                            if (line.match(/^\d+\./)) {
                                // This is a new numbered question - save current and start new
                                if (currentQuestion.length > 10) {
                                    questions.push(currentQuestion.trim());
                                }
                                const newMatch = line.match(/^\d+\.\s*(.+)$/);
                                currentQuestion = newMatch ? newMatch[1] : '';
                            } else if (line.match(/^[-•→*]\s*(.+)$/)) {
                                // This is a new bullet question - save current and start new
                                if (currentQuestion.length > 10) {
                                    questions.push(currentQuestion.trim());
                                }
                                const bulletMatch = line.match(/^[-•→*]\s*(.+)$/);
                                currentQuestion = bulletMatch ? bulletMatch[1] : '';
                            } else {
                                currentQuestion += ' ' + line;
                            }
                        }
                        // Standalone question ending with ?
                        else if (line.length > 10 && line.endsWith('?') && !line.match(/^\d+\./)) {
                            questions.push(line);
                        }
                    }
                    
                    // Don't forget the last question
                    if (currentQuestion && currentQuestion.length > 10) {
                        questions.push(currentQuestion.trim());
                    }
                    
                    // Basic validation - filter incomplete questions
                    // The LLM should generate complete questions, but we catch incomplete ones
                    console.log('[EXTRACT] Raw questions before filtering:', questions);
                    questions = questions.filter(q => {
                        const cleaned = q.trim();
                        // Remove questions that are just numbers or very short (relaxed from 15 to 10)
                        if (cleaned.length < 10) {
                            console.log('[FILTER] Too short:', cleaned);
                            return false;
                        }
                        // Remove questions that are just fragments
                        if (cleaned.match(/^[\d\s\.\?]+$/)) return false;
                        // CRITICAL: Filter incomplete questions FIRST (before checking for question mark)
                        // Check for questions ending with incomplete prepositions/verbs (with or without question mark)
                        const incompleteEndings = /\b(between|affect|surrounding|involving|regarding|concerning|about|with|for|to|from|of|in|on|at|by|during|through|across|among|within|without|against|toward|towards|into|onto|upon|under|over|above|below|beside|besides|beyond|behind|before|after|since|until|while)\s*\?*$/i;
                        if (incompleteEndings.test(cleaned)) {
                            console.warn('Incomplete question detected (ends with preposition/verb):', cleaned);
                            return false;
                        }
                        // CRITICAL: Also check if question ends with "surrounding" or "between" even if it has a question mark
                        if (cleaned.match(/\b(surrounding|between|affect|involving)\s*\?$/i)) {
                            console.warn('Incomplete question detected (ends with verb/preposition + ?):', cleaned);
                            return false;
                        }
                        // CRITICAL: Questions should end with "?" but allow some flexibility
                        if (!cleaned.endsWith('?')) {
                            // Allow questions without ? if they're clearly questions (start with question word)
                            const isQuestionWord = /^(what|how|when|where|why|who|tell me|describe|explain)/i.test(cleaned);
                            if (!isQuestionWord) {
                                console.warn('Question missing question mark and not starting with question word:', cleaned);
                                return false;
                            }
                            // Add ? if missing
                            cleaned = cleaned + '?';
                        }
                        // Additional check: even with question mark, if it ends with a preposition, it's incomplete
                        const incompletePrepositions = /\b(between|affect|surrounding|involving|regarding|concerning|about|with|for|to|from|of|in|on|at|by|during|through|across|among|within|without|against|toward|towards|into|onto|upon|under|over|above|below|beside|besides|beyond|behind|before|after|since|until|while)\s*\?$/i;
                        if (incompletePrepositions.test(cleaned)) {
                            console.warn('Incomplete question detected (ends with preposition + ?):', cleaned);
                            return false;
                        }
                        // Check for questions that are clearly incomplete (very short after removing common question starters)
                        const questionStarters = /^(what|how|when|where|why|who|tell me|describe|explain)\s+/i;
                        if (questionStarters.test(cleaned)) {
                            const afterStarter = cleaned.replace(questionStarters, '').trim();
                            // If what remains is very short, it's likely incomplete
                            if (afterStarter.length < 20) {
                                console.warn('Incomplete question detected (too short after starter):', cleaned);
                                return false;
                            }
                            // If it ends with a preposition (with or without question mark), it's incomplete
                            if (incompleteEndings.test(afterStarter)) {
                                console.warn('Incomplete question detected (ends with preposition after starter):', cleaned);
                                return false;
                            }
                        }
                        return true;
                    }).map(q => {
                        // Ensure all questions end with ?
                        const cleaned = q.trim();
                        return cleaned.endsWith('?') ? cleaned : cleaned + '?';
                    });
                    
                    console.log('[EXTRACT] Questions after filtering:', questions.length, questions);
                    
                    if (questions.length > 0) {
                        // Remove the questions section from original text
                        const cleanText = text.substring(0, match.index).trim();
                        return { text: cleanText, questions: questions };
                    } else {
                        console.warn('[EXTRACT] Questions section found but all questions filtered out. Raw section:', questionsSection.substring(0, 200));
                    }
                }
            }
            
            // If no questions section found, check if answer ends with questions anyway
            console.log('[EXTRACT] No questions section pattern matched. Answer ends with:', text.substring(Math.max(0, text.length - 200)));
            return { text: text, questions: [] };
        }
        
        function displaySuggestedQuestions(questions, containerElement) {
            // Use provided container or fall back to default
            const container = containerElement || document.getElementById('suggested-questions-container');
            if (!container) {
                console.error('Suggested questions container not found!');
                return;
            }
            
            if (!questions || questions.length === 0) {
                container.style.display = 'none';
                return;
            }
            
            // Debug: log questions to console
            console.log('Extracted questions:', questions);
            console.log('Number of questions:', questions.length);
            
            // Build HTML with individual clickable items
            // Filter out incomplete questions one more time before display
            const validQuestions = questions.filter(q => {
                const cleaned = q.trim();
                // Must be at least 15 chars
                if (cleaned.length < 15) {
                    console.log('Filtered out (too short):', cleaned);
                    return false;
                }
                // Must start with question word or capital letter
                const questionStartPattern = /^(What|Who|How|When|Where|Why|Tell me|Describe|Explain|What was|What were|What is|What are|How did|How does|How do|When did|When does|Where did|Where does|Why did|Why does)/i;
                if (!questionStartPattern.test(cleaned) && !cleaned.match(/^[A-Z]/)) {
                    console.log('Filtered out (bad start):', cleaned);
                    return false;
                }
                // Must not end with incomplete words
                const incompletePattern = /\b(with|of|to|for|in|on|at|by|from|about|into|onto|upon|the|a|an)\s*$/i;
                if (incompletePattern.test(cleaned) && !cleaned.endsWith('?')) {
                    console.log('Filtered out (incomplete ending):', cleaned);
                    return false;
                }
                return true;
            });
            
            console.log('Valid questions after filtering:', validQuestions.length);
            console.log('Valid questions:', validQuestions);
            
            // CRITICAL: Filter out incomplete questions that end with prepositions/verbs
            const finalValidQuestions = validQuestions.filter(q => {
                const cleaned = q.trim();

        function buildAutocompleteIndex() {
            indexedTermsLower = indexedTerms.map(term => term.toLowerCase());

        function getTagsForTerm(term) {
            // First check identity metadata (from server)
            const metadata = identityMetadata[term];
            if (metadata) {
                console.log(`[TAGS] Found metadata for "${term}":`, metadata);
                const tags = [];
                // If term is a surname, show its identities (separate tags, not fused)
                if (metadata.identities && metadata.identities.length > 0) {
                    // Capitalize each identity and add as separate tag
                    const identityTags = metadata.identities.map(id => id.charAt(0).toUpperCase() + id.slice(1));
                    tags.push(...identityTags);
                    
                    // If likely fusion of unrelated families, add warning
                    if (metadata._likely_fusion) {
                        tags.push('⚠️ Multiple families?');
                    }
                }
                // If term is an identity, show "Identity" tag
                if (metadata.related_surnames && metadata.related_surnames.length > 0) {
                    tags.push('Identity');
                }
                if (tags.length > 0) {
                    // Use " | " separator to show identities are separate, not fused
                    return tags.join(' | ');
                }
            }
            // Fallback to SAMPLE_TAGS (hardcoded)
            const sampleTags = SAMPLE_TAGS.get(term.toLowerCase());
            if (!sampleTags || sampleTags.size === 0) return '';
            return Array.from(sampleTags).join(', ');
        }

        function getAutocompleteSuggestions(query) {
            if (!indexedTermsLoaded || indexedTerms.length === 0) return [];
            const q = (query || '').trim().toLowerCase();
            if (q.length < 2) return [];

            const results = [];
            const seen = new Set();

            // Check if query matches an identity term - if so, also show related surnames
            // Need to check both the exact term and its variants (e.g., "black" matches "Blacks")
            let relatedSurnames = [];
            for (const [term, metadata] of Object.entries(identityMetadata)) {
                if (!metadata.related_surnames) continue;
                const termLower = term.toLowerCase();
                // Exact match
                if (termLower === q) {
                    relatedSurnames = metadata.related_surnames;
                    break;
                }
                // Prefix match (query is prefix of term, e.g., "black" -> "blacks")
                if (termLower.startsWith(q)) {
                    relatedSurnames = metadata.related_surnames;
                    break;
                }
                // Term is prefix of query (e.g., "blacks" -> "black")
                if (q.startsWith(termLower)) {
                    relatedSurnames = metadata.related_surnames;
                    break;
                }
                // Check if they're singular/plural variants (e.g., "black" vs "blacks")
                const qBase = q.endsWith('s') ? q.slice(0, -1) : q;
                const termBase = termLower.endsWith('s') ? termLower.slice(0, -1) : termLower;
                if (qBase === termBase && qBase.length > 2) {
                    relatedSurnames = metadata.related_surnames;
                    break;
                }
            }

            // Prefix matches first
            for (let i = 0; i < indexedTermsLower.length; i++) {
                const termLower = indexedTermsLower[i];
                if (termLower.startsWith(q)) {
                    if (!seen.has(termLower)) {
                        results.push(indexedTerms[i]);
                        seen.add(termLower);
                    }
                    if (results.length >= MAX_AUTOCOMPLETE_RESULTS && relatedSurnames.length === 0) return results;
                }
            }

            // Then contains matches
            for (let i = 0; i < indexedTermsLower.length; i++) {
                const termLower = indexedTermsLower[i];
                if (!seen.has(termLower) && termLower.includes(q)) {
                    results.push(indexedTerms[i]);
                    seen.add(termLower);
                    if (results.length >= MAX_AUTOCOMPLETE_RESULTS && relatedSurnames.length === 0) break;
                }
            }

            // If query matches an identity, add related surnames (up to 5)
            if (relatedSurnames.length > 0) {
                for (const surname of relatedSurnames.slice(0, 5)) {
                    const surnameLower = surname.toLowerCase();
                    if (!seen.has(surnameLower) && indexedTerms.includes(surname)) {
                        results.push(surname);
                        seen.add(surnameLower);
                        if (results.length >= MAX_AUTOCOMPLETE_RESULTS) break;
                    }
                }
            }

            return results;
        }

        function hyperlinkIndexedTerms(html) {
            if (!indexedTerms || indexedTerms.length === 0) {
                console.log('[HYPERLINK] No indexed terms available, skipping hyperlinking');
                return html;
            }
            console.log('[HYPERLINK] Processing HTML for hyperlinking,', indexedTerms.length, 'terms available');
            
            // Use DOM manipulation for safer HTML processing
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            
            // Process all text nodes
            const walker = document.createTreeWalker(
                tempDiv,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode: function(node) {
                        // Skip if parent is a link or script/style tag
                        const parent = node.parentElement;
                        if (parent && (
                            parent.tagName === 'A' || 
                            parent.tagName === 'SCRIPT' || 
                            parent.tagName === 'STYLE' ||
                            parent.classList.contains('indexed-term-link')
                        )) {
                            return NodeFilter.FILTER_REJECT;
                        }
                        return NodeFilter.FILTER_ACCEPT;
                    }
                },
                false
            );
            
            const textNodes = [];
            let node;
            while (node = walker.nextNode()) {
                textNodes.push(node);
            }
            
            // Process each text node (in reverse order to avoid index issues)
            let totalLinks = 0;
            for (let i = textNodes.length - 1; i >= 0; i--) {
                const textNode = textNodes[i];
                const text = textNode.textContent;
                const linked = hyperlinkText(text);
                if (linked !== text) {
                    // Replace text node with HTML
                    const wrapper = document.createElement('span');
                    wrapper.innerHTML = linked;
                    const linkCount = (linked.match(/indexed-term-link/g) || []).length;
                    totalLinks += linkCount;
                    // Replace the text node with the wrapper's children
                    const parent = textNode.parentNode;
                    while (wrapper.firstChild) {
                        parent.insertBefore(wrapper.firstChild, textNode);
                    }
                    parent.removeChild(textNode);
                }
            }
            
            if (totalLinks > 0) {
                console.log(`[HYPERLINK] Created ${totalLinks} hyperlinks`);
            } else {
                console.log('[HYPERLINK] No hyperlinks created - checking if terms match...');
            }
            
            return tempDiv.innerHTML;
        }
        
        function hyperlinkText(text) {
            if (!text || text.trim().length === 0 || !indexedTerms || indexedTerms.length === 0) return text;
            
            // Create a case-insensitive map for quick lookup
            // ONLY include multi-word terms OR single-word terms that are clearly entities (all caps, special chars, etc.)
            const termMap = new Map();
            indexedTerms.forEach(term => {
                const lower = term.toLowerCase();
                
                // Exclude the query subject itself (don't hyperlink "Bank of Montreal" in a query about "Bank of Montreal")
                // Also exclude the acronym (don't hyperlink "WFC" in a query about "War Finance Corporation")
                if (currentQuerySubject && lower === currentQuerySubject) {
                    return;
                }
                if (currentQuerySubjectAcronym && lower === currentQuerySubjectAcronym) {
                    return;
                }
                
                // Trust the backend filtering - if a term is in the index and sent to frontend, it should be hyperlinkable
                // The /terms endpoint already filters out:
                // - Generic words/phrases
                // - Terms with 0 chunks
                // - Very short lowercase terms
                // - Verb forms, numbers, etc.
                // So we can be permissive here - only exclude the query subject itself
                
                // Add all terms to the map (backend has already done the filtering)
                if (!termMap.has(lower)) {
                    termMap.set(lower, term);
                }
            });
            
            // Sort terms by length (longest first) to match longer terms first
            const sortedTerms = Array.from(termMap.entries()).sort((a, b) => b[0].length - a[0].length);
            
            // Collect all matches first (with their positions)
            const matches = [];
            for (const [lowerTerm, originalTerm] of sortedTerms) {
                // Escape special regex characters
                const escaped = lowerTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                
                // For multi-word terms, use a more flexible pattern that doesn't require word boundaries
                // between words (e.g., "Warburg New York" should match even if there's punctuation)
                // For single-word terms, use strict word boundaries
                // CRITICAL: Use case-sensitive matching for proper nouns to distinguish "DuPont" vs "Dupont"
                // Only use case-insensitive for identity terms (which are handled separately)
                let regex;
                const originalTermHasMixedCase = originalTerm !== originalTerm.toLowerCase() && originalTerm !== originalTerm.toUpperCase();
                const isProperNoun = originalTermHasMixedCase && !lowerTerm.includes(' '); // Single-word mixed case = likely proper noun
                
                if (lowerTerm.includes(' ')) {
                    // Multi-word: allow spaces, hyphens, and punctuation between words
                    // But require word boundaries at start and end
                    // Use case-insensitive for multi-word (usually phrases, not proper nouns)
                    const flexiblePattern = escaped.replace(/\s+/g, '[\\s\\-.,;:!?]*');
                    regex = new RegExp(`\\b${flexiblePattern}\\b`, 'gi');
                } else if (isProperNoun) {
                    // Single-word proper noun with mixed case: use case-sensitive matching
                    // This distinguishes "DuPont" from "Dupont"
                    const escapedOriginal = originalTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    regex = new RegExp(`\\b(${escapedOriginal})\\b`, 'g');
                } else {
                    // Single-word: strict word boundaries, case-insensitive for acronyms/common terms
                    regex = new RegExp(`\\b(${escaped})\\b`, 'gi');
                }
                
                let match;
                while ((match = regex.exec(text)) !== null) {
                    matches.push({
                        index: match.index,
                        length: match[0].length,
                        text: match[0],
                        term: originalTerm,
                        lowerTerm: lowerTerm
                    });
                }
            }
            
            // Sort matches by: 1) length (longest first), then 2) position (earliest first)
            // This ensures "Warburg New York" beats "Warburg" or "New York"
            matches.sort((a, b) => {
                if (b.length !== a.length) return b.length - a.length;  // Longer first
                return a.index - b.index;  // If same length, earlier first
            });
            
            // Remove overlapping/nested matches (keep the longest/earliest one)
            // CRITICAL: This prevents "Warburg" and "New York" from being matched when "Warburg New York" is already matched
            // Also prevents "Laos" from being matched when "Bank of Laos" is already matched
            // Also prevents "National Bank" from being matched when "Hungarian National Bank" is already matched
            const nonOverlapping = [];
            for (const match of matches) {
                const matchStart = match.index;
                const matchEnd = match.index + match.length;
                
                // Check for overlaps with existing matches
                const overlaps = nonOverlapping.some(existing => {
                    const existingStart = existing.index;
                    const existingEnd = existing.index + existing.length;
                    
                    // Check if this match overlaps with or is nested within an existing match
                    // Overlap if: match starts inside existing, match ends inside existing, or match completely contains existing
                    const isNested = (matchStart >= existingStart && matchEnd <= existingEnd) ||
                                    (matchStart > existingStart && matchEnd < existingEnd);
                    const isOverlapping = (matchStart >= existingStart && matchStart < existingEnd) ||
                                         (matchEnd > existingStart && matchEnd <= existingEnd) ||
                                         (matchStart <= existingStart && matchEnd >= existingEnd);
                    
                    // If this match is nested within an existing longer match, skip it
                    if (isNested && existing.length > match.length) {
                        return true;
                    }
                    // If existing match is nested within this match (this is longer), remove existing
                    if (isNested && match.length > existing.length) {
                        const existingIndex = nonOverlapping.indexOf(existing);
                        if (existingIndex >= 0) {
                            nonOverlapping.splice(existingIndex, 1);
                        }
                        return false; // Don't skip this match, we removed the shorter one
                    }
                    
                    return isOverlapping;
                });
                
                if (overlaps) {
                    continue; // Skip this match - it overlaps with an existing one
                }
                
                // CRITICAL: Check if this single-word match is part of a longer multi-word match
                // If "Bank of Laos" exists, don't hyperlink "Laos" separately
                // If "Hungarian National Bank" exists, don't hyperlink "National Bank" separately
                if (!match.lowerTerm.includes(' ')) {
                    // This is a single-word match - check if it's contained in any longer match
                    const isPartOfLongerMatch = matches.some(otherMatch => {
                        if (otherMatch === match) return false;
                        if (!otherMatch.lowerTerm.includes(' ')) return false; // Other is also single-word
                        const otherStart = otherMatch.index;
                        const otherEnd = otherMatch.index + otherMatch.length;
                        // Check if this single-word match is within the longer match
                        return matchStart >= otherStart && matchEnd <= otherEnd;
                    });
                    
                    if (isPartOfLongerMatch) {
                        continue; // Skip - this is part of a longer match
                    }
                } else {
                    // This is a multi-word match - check if any shorter match is nested within it
                    // Remove any shorter matches that are nested
                    for (let i = nonOverlapping.length - 1; i >= 0; i--) {
                        const existing = nonOverlapping[i];
                        if (existing === match) continue;
                        const existingStart = existing.index;
                        const existingEnd = existing.index + existing.length;
                        // If existing is shorter and nested within this match, remove it
                        if (existing.length < match.length &&
                            existingStart >= matchStart && existingEnd <= matchEnd) {
                            nonOverlapping.splice(i, 1);
                        }
                    }
                }
                
                nonOverlapping.push(match);
            }
            
            // Sort by index descending for replacement (so indices don't shift)
            nonOverlapping.sort((a, b) => b.index - a.index);
            
            // Replace matches from end to start (so indices don't shift)
            let result = text;
            for (const match of nonOverlapping) {
                const query = `Tell me about ${match.term}`;
                const escapedQuery = query.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
                const link = `<a href="#" class="indexed-term-link" onclick="event.preventDefault(); event.stopPropagation(); selectIndexedQuery('${escapedQuery}'); return false;" style="color: #c9a227; text-decoration: underline; cursor: pointer;" title="Click to search for: ${match.term}">${match.text}</a>`;
                
                result = result.substring(0, match.index) + link + result.substring(match.index + match.length);
            }
            
            return result;
        }
        
        function formatMarkdown(text) {
            // Simple markdown-to-HTML converter
            let html = text;
            
            // Headers (do ## before # to avoid double-replacement)
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');  // Treat H1 as H2
            html = html.replace(/^\*\*(.+)\*\*$/gm, '<h3>$1</h3>');
            
            // Bold text
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            
            // Italic text (bank names)
            html = html.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
            
            // Line breaks - preserve paragraph structure
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';
            
            // Clean up empty paragraphs and paragraphs around headers
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p>\s*<\/p>/g, '');
            html = html.replace(/<p>(<h[123]>)/g, '$1');
            html = html.replace(/(<\/h[123]>)<\/p>/g, '$1');
            
            // Hyperlink indexed terms
            html = hyperlinkIndexedTerms(html);
            
            return html;
        }

        async function askQuestion() {

            async function fetchWithRetry(url, options, retries = 3, baseDelayMs = 800) {
                let attempt = 0;
                while (true) {
                    try {
                        const res = await fetch(url, options);
                        if (res.status === 429 || res.status === 502 || res.status === 503) {
                            if (attempt >= retries) return res;
                            const delay = baseDelayMs * Math.pow(2, attempt);
                            setProgress(Math.min(95, (attempt + 1) * 10 + 30), `Rate limit hit. Retrying in ${Math.ceil(delay/1000)}s...`);
                            await new Promise(r => setTimeout(r, delay));
                            attempt += 1;
                            continue;
                        }
                        return res;
                    } catch (e) {
                        if (attempt >= retries) throw e;
                        const delay = baseDelayMs * Math.pow(2, attempt);
                        setProgress(Math.min(95, (attempt + 1) * 10 + 30), `Network error. Retrying in ${Math.ceil(delay/1000)}s...`);
                        await new Promise(r => setTimeout(r, delay));
                        attempt += 1;
                    }
                }
            }

                // Function to calculate time estimate based on chunk count, batching, and async processing
                function calculateTimeEstimate(chunkCount) {
                    if (!chunkCount) return null;
                    
                    // Constants from backend
                    const BATCH_SIZE = 20; // chunks per batch
                    const MAX_CONCURRENT = 10; // max concurrent batches
                    const BATCH_DELAY = 0.5; // seconds between batches
                    const KEY_ROTATION_DELAY = 4.0; // seconds per key rotation (15 RPM)
                    const LLM_CALL_TIME = 8; // seconds per LLM API call (average)
                    const SETUP_TIME = 5; // seconds for setup/retrieval
                    const MERGE_TIME = 6; // seconds to merge batches
                    
                    // Calculate batches
                    const numBatches = Math.ceil(chunkCount / BATCH_SIZE);
                    
                    // Base time: setup and retrieval
                    let estimatedSeconds = SETUP_TIME;
                    
                    if (numBatches === 1) {
                        // Single batch: no batching overhead
                        estimatedSeconds += LLM_CALL_TIME;
                    } else {
                        // Multiple batches: account for async processing
                        // Batches run concurrently (up to MAX_CONCURRENT at a time)
                        const concurrentRounds = Math.ceil(numBatches / MAX_CONCURRENT);
                        
                        // Time for concurrent rounds
                        // Each round processes up to MAX_CONCURRENT batches in parallel
                        // But we need to account for rate limiting between batches
                        for (let round = 0; round < concurrentRounds; round++) {
                            const batchesInRound = Math.min(MAX_CONCURRENT, numBatches - (round * MAX_CONCURRENT));
                            
                            // All batches in round run concurrently, but with delays
                            // First batch: no delay, subsequent: BATCH_DELAY
                            const roundTime = LLM_CALL_TIME + (batchesInRound - 1) * BATCH_DELAY;
                            
                            // Add key rotation delay if we have multiple keys (every 4 batches)
                            const keyRotations = Math.floor(batchesInRound / 4);
                            const keyRotationTime = keyRotations * KEY_ROTATION_DELAY;
                            
                            estimatedSeconds += roundTime + keyRotationTime;
                            
                            // Delay between rounds (if not last round)
                            if (round < concurrentRounds - 1) {
                                estimatedSeconds += KEY_ROTATION_DELAY; // Wait before next round
                            }
                        }
                        
                        // Add merge time if multiple batches
                        estimatedSeconds += MERGE_TIME;
                    }
                    
                    // Round up to nearest 5 seconds for safety margin
                    estimatedSeconds = Math.ceil(estimatedSeconds / 5) * 5;
                    
                    // Format output
                    if (estimatedSeconds < 30) {
                        return `~${estimatedSeconds}s`;
                    } else if (estimatedSeconds < 60) {
                        return `~${estimatedSeconds}s`;
                    } else {
                        const minutes = Math.floor(estimatedSeconds / 60);
                        const seconds = estimatedSeconds % 60;
                        if (seconds === 0) {
                            return `~${minutes}m`;
                        } else if (seconds < 30) {
                            return `~${minutes}m`;
                        } else {
                            return `~${minutes + 1}m`;
                        }
                    }

                console.warn('[HYPERLINK] Hyperlinking will be disabled until terms are loaded');
            }
        })();
        
        // Ensure functions are globally accessible (for backward compatibility)
        window.askQuestion = askQuestion;
        window.showIndexed = showIndexed;
        window.selectIndexedQuery = selectIndexedQuery;
        console.log('Functions registered globally:', { askQuestion: typeof askQuestion, showIndexed: typeof showIndexed, selectIndexedQuery: typeof selectIndexedQuery });
    </script>
